services:
  - type: web
    name: syspragas
    env: docker
    plan: free
    disk:
      name: syspragas-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/syspragas.db
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
      - key: DEFAULT_ADMIN_PASSWORD
        value: syspragas123
