{% macro crud_view(view_id, form_title, form_description, form_id, table_title, table_description, table_target_id, layout_class='') -%}
<section class="view" id="view-{{ view_id }}">
    <div class="split-panel {{ layout_class }}">
        <section class="card panel form-panel">
            <div class="card-body">
                <div class="section-heading">
                    <h3>{{ form_title }}</h3>
                    <p>{{ form_description }}</p>
                </div>
                <form id="{{ form_id }}" class="data-form"></form>
            </div>
        </section>
        <section class="card panel">
            <div class="card-body">
                <div class="section-heading">
                    <h3>{{ table_title }}</h3>
                    <p>{{ table_description }}</p>
                </div>
                <div id="{{ table_target_id }}"></div>
            </div>
        </section>
    </div>
</section>
{%- endmacro %}
