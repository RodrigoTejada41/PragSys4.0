services:
  syspragas:
    build: .
    container_name: ${SYS_PRAGAS_CONTAINER_NAME:-syspragas}
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-8001}:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      DATABASE_URL: sqlite:////data/syspragas.db
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?Configure DEFAULT_ADMIN_PASSWORD no arquivo .env}
      GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_CALENDAR_ACCESS_TOKEN: ${GOOGLE_CALENDAR_ACCESS_TOKEN:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-https://www.googleapis.com/auth/calendar.events openid email profile}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-evolution}
      WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-http://whatsapp-bridge:3100}
      WHATSAPP_MESSAGE_API_URL: ${WHATSAPP_MESSAGE_API_URL:-}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-${WHATSAPP_BRIDGE_API_KEY:-}}
      WHATSAPP_AUTH_TOKEN: ${WHATSAPP_AUTH_TOKEN:-}
      WHATSAPP_SENDER_ID: ${WHATSAPP_SENDER_ID:-}
      WHATSAPP_INSTANCE_NAME: ${WHATSAPP_INSTANCE_NAME:-syspragas}
      WHATSAPP_STATUS_API_URL: ${WHATSAPP_STATUS_API_URL:-}
      WHATSAPP_QR_API_URL: ${WHATSAPP_QR_API_URL:-}
      WHATSAPP_CONNECT_API_URL: ${WHATSAPP_CONNECT_API_URL:-}
      WHATSAPP_LOGOUT_API_URL: ${WHATSAPP_LOGOUT_API_URL:-}
      WHATSAPP_TIMEOUT_SECONDS: ${WHATSAPP_TIMEOUT_SECONDS:-15}
      NFE_PROVIDER: ${NFE_PROVIDER:-focus_nfe}
      FOCUS_NFE_API_BASE_URL: ${FOCUS_NFE_API_BASE_URL:-}
      FOCUS_NFE_API_KEY: ${FOCUS_NFE_API_KEY:-}
      FOCUS_NFE_ENVIRONMENT: ${FOCUS_NFE_ENVIRONMENT:-homologacao}
      FOCUS_NFE_TIMEOUT_SECONDS: ${FOCUS_NFE_TIMEOUT_SECONDS:-30}
      FOCUS_NFE_WEBHOOK_SECRET: ${FOCUS_NFE_WEBHOOK_SECRET:-}
      SEFAZ_NFE_UF: ${SEFAZ_NFE_UF:-}
      SEFAZ_NFE_SERIE: ${SEFAZ_NFE_SERIE:-1}
      SEFAZ_NFE_CERTIFICATE_PATH: /run/sefaz/certificado/certificado_a1.pfx
      SEFAZ_NFE_CERTIFICATE_PASSWORD: ${SEFAZ_NFE_CERTIFICATE_PASSWORD:-}
      SEFAZ_NFE_XSD_DIR: /run/sefaz/xsd
      SEFAZ_NFE_WS_URLS_JSON: ${SEFAZ_NFE_WS_URLS_JSON:-}
      SEFAZ_NFE_VERIFY_TLS: ${SEFAZ_NFE_VERIFY_TLS:-true}
      NFE_DANFE_STORAGE_DIR: ${NFE_DANFE_STORAGE_DIR:-/data/nfe_danfe}
      COMPANY_CNPJ: ${COMPANY_CNPJ:-}
      COMPANY_IE: ${COMPANY_IE:-}
      COMPANY_IM: ${COMPANY_IM:-}
      COMPANY_CNAE: ${COMPANY_CNAE:-}
      COMPANY_CRT: ${COMPANY_CRT:-1}
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME:-}
      COMPANY_TRADE_NAME: ${COMPANY_TRADE_NAME:-}
      COMPANY_STREET: ${COMPANY_STREET:-}
      COMPANY_NUMBER: ${COMPANY_NUMBER:-}
      COMPANY_DISTRICT: ${COMPANY_DISTRICT:-}
      COMPANY_CITY: ${COMPANY_CITY:-}
      COMPANY_CITY_CODE: ${COMPANY_CITY_CODE:-}
      COMPANY_STATE: ${COMPANY_STATE:-}
      COMPANY_STATE_CODE: ${COMPANY_STATE_CODE:-}
      COMPANY_ZIP_CODE: ${COMPANY_ZIP_CODE:-}
      COMPANY_PHONE: ${COMPANY_PHONE:-}
    volumes:
      - syspragas_data:/data
      - ./modelos:/app/modelos:ro
      - ./modelo:/app/modelo:ro
      - ./assinaturas_tecnicas:/app/assinaturas_tecnicas
      # Example mounts for direct SEFAZ NF-e usage:
      # - ./certificado/certificado_a1.pfx:/run/sefaz/certificado/certificado_a1.pfx:ro
      # - ./XSD/Schemas:/run/sefaz/xsd:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  whatsapp-bridge:
    profiles: ["whatsapp-bridge"]
    build:
      context: ./services/whatsapp-bridge
    container_name: ${WHATSAPP_BRIDGE_CONTAINER_NAME:-syspragas-whatsapp-bridge}
    restart: unless-stopped
    ports:
      - "${WHATSAPP_BRIDGE_HOST_BIND:-127.0.0.1}:${WHATSAPP_BRIDGE_HOST_PORT:-3100}:3100"
    environment:
      WHATSAPP_BRIDGE_HOST: 0.0.0.0
      WHATSAPP_BRIDGE_PORT: 3100
      WHATSAPP_BRIDGE_API_KEY: ${WHATSAPP_BRIDGE_API_KEY:-}
      WHATSAPP_BRIDGE_LOG_LEVEL: ${WHATSAPP_BRIDGE_LOG_LEVEL:-info}
      WHATSAPP_BRIDGE_SESSION_DIR: /bridge/sessions
    volumes:
      - whatsapp_bridge_sessions:/bridge/sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  syspragas_data:
  whatsapp_bridge_sessions:
