<aside class="main-sidebar sidebar-dark-success elevation-4 app-sidebar">
    <a href="#" class="brand-link app-sidebar-brand">
        <i class="fas fa-bug brand-icon"></i>
        <span class="brand-text font-weight-light">SysPragas</span>
    </a>

    <div class="sidebar">
        <div class="user-panel mt-3 pb-3 mb-3 d-flex align-items-center app-sidebar-user-panel">
            <div class="image d-flex align-items-center justify-content-center">
                <span class="user-avatar"><i class="fas fa-user-shield"></i></span>
            </div>
            <div class="info">
                <span id="current-user-name">Administrador</span>
                <div class="sidebar-session-actions">
                    <button class="btn btn-default ghost-button btn-xs" id="sidebar-logout-button" type="button">Trocar usuario</button>
                </div>
            </div>
        </div>

        <nav class="mt-2 app-sidebar-nav">
            <ul class="nav nav-pills nav-sidebar flex-column" id="nav-list" data-widget="treeview" role="menu" data-accordion="false">
                {% for item in nav_items %}
                {% if item.kind == "header" %}
                <li class="nav-header syspragas-nav-header {{ item.classes }}">{{ item.label }}</li>
                {% else %}
                <li class="nav-item {{ item.classes }}">
                    <a href="#" class="nav-link nav-item {% if item.view == 'dashboard' %}active{% endif %}" data-view="{{ item.view }}">
                        <i class="nav-icon {{ item.icon }}"></i>
                        <p>{{ item.label }}</p>
                    </a>
                </li>
                {% endif %}
                {% endfor %}
            </ul>
        </nav>
    </div>
</aside>
