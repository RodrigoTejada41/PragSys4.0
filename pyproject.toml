[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syspragas"
version = "4.1.0"
description = "MVP do sistema SysPragas com FastAPI, JWT e controle operacional"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.12",
    "jinja2==3.1.6",
    "python-multipart==0.0.20",
    "uvicorn==0.34.0",
    "sqlalchemy==2.0.39",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "PyJWT==2.10.1",
    "httpx==0.28.1",
    "reportlab==4.3.1",
    "pypdf==5.4.0",
    "lxml==5.3.0",
    "signxml==4.0.3",
    "cryptography==44.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["assets*", "build*", "dist*", "output*", "tmp*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: testes unitarios ou quase unitarios",
    "integration: testes de integracao com app, banco ou HTTP local",
    "documents: testes focados em geracao de documentos e PDFs",
    "external: testes com contratos de integracoes externas simuladas",
]
